# Merge these entries under `patch:` in the existing
# double_pinyin_flypy.custom.yaml.  This file is an integration fragment, not
# an automatically discovered Rime custom file.

patch:
  # Compile/query the official Luna dictionary plus Voice Fly personal terms.
  "translator/dictionary": luna_pinyin.voicefly

  # Keep the existing learned ranking database instead of creating
  # luna_pinyin.voicefly.userdb.  This is intentionally explicit even though
  # librime also derives the language component before the first dot.
  "translator/user_dict": luna_pinyin

  # Keep generated profile phrases separate from mutable user learning. The
  # profile publisher owns custom_phrase.txt but must never replace
  # voicefly_learned_phrases.txt.
  "engine/translators":
    - table_translator@engineering_symbols
    - table_translator@custom_phrase
    - table_translator@learned_phrases
    - punct_translator
    - reverse_lookup_translator
    - script_translator

  learned_phrases:
    dictionary: ""
    user_dict: voicefly_learned_phrases
    db_class: stabledb
    # Explicit learning is an exact-match action. Predictive completion here
    # lets a one-key prefix outrank normal typing once initial_quality is 1.
    enable_completion: false
    enable_sentence: true
    # New explicit phrases are 2-4 Han characters (at least four Flypy keys).
    # Keep historical one-character rows out of this high-priority translator.
    disable_user_dict_for_patterns:
      - '^[a-z]{1,2}$'
    # A deliberate double-space learning action owns the exact-match first slot.
    # Keep this at 1: 0 loses to ordinary exact dictionary matches.
    initial_quality: 1
